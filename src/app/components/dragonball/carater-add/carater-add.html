<h3>Agregar: {{name()}}</h3>

    <input
    type="text"
    class="form-control"
    placeholder="Nombre"
    [value]="name()"
    (change)="name.set($event.target.value)"
    >

    <h3>Poder: {{power()}}</h3>

    <input
    type="number"
    class="form-control mt-2"
    placeholder="Poder"
    [value]=power()
    (change)="power.set($event.target.valueAsNumber)"
    >

    <button (click)="addCharacter()" class="mt-2 btn btn-primary">Agregar</button>
